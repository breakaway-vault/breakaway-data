name: release
# Builds the standalone app (no Python needed) for Windows, macOS and Linux when a tag like v1.0.0 is pushed,
# and attaches Breakaway-Archive-<os>.zip to the GitHub Release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - run: python scripts/validate.py
      - run: python scripts/build_app.py
      - name: Smoke test (offline build of the spreadsheet)
        shell: bash
        run: |
          mkdir smoke && cd smoke
          python -m zipfile -e ../dist/Breakaway-Archive-*.zip .
          cd Breakaway-Archive
          if [ -f breakaway.exe ]; then ./breakaway.exe build --offline; else chmod +x breakaway && ./breakaway build --offline; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Breakaway-Archive-${{ matrix.os }}
          path: dist/*.zip
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: false
