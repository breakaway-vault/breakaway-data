name: collector-hall
# Turns a "Collector Hall submission" issue into a pull request that adds collections/<slug>.csv + .json.
# The fan types a display name ("Rink Rat 97"); hall_submit.py derives the slug (rink_rat_97) used for files and #h= links.
# Cards may be pasted or a GitHub attachment link (drag-and-drop); hall_submit.py downloads allowed hosts only.
# Nothing is published until a maintainer merges that pull request.
# Needs: Settings > Actions > General > Workflow permissions > "Allow GitHub Actions to create and approve pull requests".
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: read
concurrency:
  group: collector-hall-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  submit:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'collector hall') ||
       startsWith(github.event.issue.title, 'Collector Hall:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      USER_ID: ${{ github.event.issue.user.id }}
      BRANCH: collector-hall/issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the submission
        id: check
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          if python scripts/hall_submit.py --body "$RUNNER_TEMP/body.md" --user-id "$USER_ID" --result "$RUNNER_TEMP/result.json" > /dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          python scripts/hall_comment.py "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/comment.md"
          python -c 'import json,sys;r=json.load(open(sys.argv[1]));print("handle="+r["handle"]);print("display="+" ".join((r.get("display_name") or r["handle"]).split()))' "$RUNNER_TEMP/result.json" >> "$GITHUB_OUTPUT"
      - name: Open or update the pull request
        id: pr
        if: steps.check.outputs.ok == 'true'
        env:
          HANDLE: ${{ steps.check.outputs.handle }}
          DISPLAY: ${{ steps.check.outputs.display }}
        run: |
          git config user.name "Breakaway Archive"
          git config user.email "breakaway-archive@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A collections
          if git diff --cached --quiet; then echo "nochange=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Collector Hall: add @$HANDLE (from #$ISSUE)"
          git push -f origin "$BRANCH"
          body="Adds the Collector Hall entry \`@$DISPLAY\` (slug \`$HANDLE\`) submitted in #$ISSUE. Their page will be @$DISPLAY at collection.html#h=$HANDLE. Files: collections/$HANDLE.csv and collections/$HANDLE.json. The cards were checked with the same matching as breakaway.py and normalised to card numbers and editions. Merge to publish it; close to decline."
          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "Collector Hall: @$DISPLAY ($HANDLE)" --body "$body")
          else
            gh pr edit "$url" --title "Collector Hall: @$DISPLAY ($HANDLE)" --body "$body"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Reply on the issue
        if: always() && steps.check.outcome == 'success'
        env:
          NOCHANGE: ${{ steps.pr.outputs.nochange }}
        run: |
          f="$RUNNER_TEMP/comment.md"
          if [ "$NOCHANGE" = "true" ]; then printf '\n\nThis is the same as your collection that is already in the Collector Hall, so nothing needs to change.\n' >> "$f"; fi
          gh issue comment "$ISSUE" --body-file "$f"
