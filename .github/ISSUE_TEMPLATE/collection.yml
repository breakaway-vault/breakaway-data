name: Collector Hall submission
description: Add your collection to the public Collector Hall on the community site
title: "Collector Hall: "
labels: ["collector hall"]
body:
  - type: markdown
    attributes:
      value: |
        **Everything you post here is public, forever,** both on this page and on the site. Don't use your real name, and take out anything you want to keep private (wallet addresses, emails) before you send it.

        Drop your `my_cards.csv` into the cards box below and press the green button at the bottom to send it. We check your cards right away and reply here. We take a quick look before anything goes up, then your collection appears in the [Collector Hall](https://breakaway-vault.github.io/breakaway-data/hall.html). To change it later, fill in this form again from the same GitHub account. To take it down, use the [removal form](https://github.com/breakaway-vault/breakaway-data/issues/new?template=collection-removal.yml).
  - type: input
    id: handle
    attributes:
      label: Your collector name
      description: "The name shown on your Collector Hall page, e.g. your NHL Breakaway name. Spaces and capitals are fine (3 to 30 letters, numbers, spaces, _ - or .). Please not your real name."
      placeholder: Rink Rat 97
    validations:
      required: true
  - type: textarea
    id: cards
    attributes:
      label: Your cards
      description: |
        Drop your my_cards.csv here (drag the file into this box). You get it from "Export my cards" on The Fifth Line, or "Export my_cards.csv" on the My collection page. You can also paste what's inside the file, or card numbers or NHL Breakaway links, one per line. We only keep card and edition numbers.
      placeholder: |
        Drop your my_cards.csv here
    validations:
      required: true
  - type: input
    id: blurb
    attributes:
      label: A short line about your collection (optional)
      description: Up to 140 characters, no links.
      placeholder: Chasing every Etched In Ice goalie.
  - type: dropdown
    id: team
    attributes:
      label: Favourite team (optional)
      options:
        - "No favourite team"
        - "Anaheim Ducks"
        - "Arizona Coyotes"
        - "Boston Bruins"
        - "Buffalo Sabres"
        - "Calgary Flames"
        - "Carolina Hurricanes"
        - "Chicago Blackhawks"
        - "Colorado Avalanche"
        - "Columbus Blue Jackets"
        - "Dallas Stars"
        - "Detroit Red Wings"
        - "Edmonton Oilers"
        - "Florida Panthers"
        - "Hartford Whalers"
        - "LA Kings"
        - "Minnesota North Stars"
        - "Minnesota Wild"
        - "Montr\u00e9al Canadiens"
        - "Nashville Predators"
        - "New Jersey Devils"
        - "New York Islanders"
        - "New York Rangers"
        - "Ottawa Senators"
        - "Philadelphia Flyers"
        - "Phoenix Coyotes"
        - "Pittsburgh Penguins"
        - "Quebec Nordiques"
        - "San Jose Sharks"
        - "Seattle Kraken"
        - "St. Louis Blues"
        - "Tampa Bay Lightning"
        - "Toronto Maple Leafs"
        - "Utah Hockey Club"
        - "Vancouver Canucks"
        - "Vegas Golden Knights"
        - "Washington Capitals"
        - "Winnipeg Jets"
      default: 0
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you send
      options:
        - label: I understand this post and my collection are public, and I've taken out anything I want to keep private.
          required: true
        - label: My collector name is not my real name (or anyone else's).
          required: true
